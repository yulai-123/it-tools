server {
    listen 80;
    listen [::]:80;
    server_name tools.yulai.org;

    include /etc/nginx/snippets/cloudflare-only.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tools.yulai.org;

    include /etc/nginx/snippets/cloudflare-only.conf;

    ssl_certificate /etc/ssl/cloudflare/yulai.org.pem;
    ssl_certificate_key /etc/ssl/cloudflare/yulai.org.key;

    root /srv/it-tools/dist;
    index index.html;

    auth_basic "Yulai IT Tools";
    auth_basic_user_file /etc/nginx/.htpasswd-tools;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
